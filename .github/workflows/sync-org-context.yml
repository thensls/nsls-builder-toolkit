name: Sync Org Context

# Opens a PR rather than pushing to main. Branch protection began requiring a
# PR plus two status checks on 2026-08-31; the bot's direct push failed with
# `GH006: Protected branch update failed` every week from then on, while the
# "Run sync" step kept succeeding. org-chart.json froze at the 2026-08-24 copy
# for four weeks and nothing alerted — list_relationships.py reported
# org_chart_age_days and no consumer read it.
#
# The PR passes `plugin-version-bump` via the `_shared/context/` exemption in
# .github/scripts/check_plugin_version.py (synced data has no version to bump),
# and auto-merges once both required checks are green.
#
# It runs on SYNC_PR_TOKEN (a fine-grained PAT, contents + pull-requests write on
# this repo), NOT GITHUB_TOKEN. A PR authored by GITHUB_TOKEN does not trigger
# workflow runs, so plugin-version-bump would never report and the PR would hang
# at "Expected" forever. Granting the Actions bot a branch-protection bypass is
# not an option here: `bypass_pull_request_allowances` accepts only *installed*
# GitHub Apps, and github-actions is a built-in — the API accepts the grant and
# silently stores nothing.

on:
  schedule:
    # Weekly: Sunday 11 PM ET (Monday 3 AM UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      sync_target:
        description: 'What to sync'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - org-chart
          - lops
          - strategy

# Least privilege for GITHUB_TOKEN: the branch push and every `gh` call run on
# SYNC_PR_TOKEN instead, so the default token needs nothing beyond reading the repo.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # SYNC_PR_TOKEN, not GITHUB_TOKEN. A PR opened (or pushed to) with
      # GITHUB_TOKEN does not trigger workflow runs, so `plugin-version-bump`
      # would never report, the required check would sit at "Expected", and
      # auto-merge would never fire — the PR would hang open exactly as the
      # direct push used to fail. Checkout takes the token too, so the branch
      # push carries the same identity as the PR.
      - name: Fail early if the sync token is missing
        env:
          SYNC_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: |
          if [ -z "${SYNC_PR_TOKEN}" ]; then
            echo "::error::SYNC_PR_TOKEN is not set. The sync PR would open but \
          never merge, because a GITHUB_TOKEN-authored PR does not trigger the \
          required plugin-version-bump check. Add a fine-grained PAT (contents + \
          pull-requests: write on this repo) as the SYNC_PR_TOKEN repo secret."
            exit 1
          fi
          echo "SYNC_PR_TOKEN present (${#SYNC_PR_TOKEN} chars)."

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PR_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine sync target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Cron runs org-chart every week, lops on even weeks
            WEEK=$(date +%V)
            if [ $((WEEK % 2)) -eq 0 ]; then
              echo "flags=--org-chart --lops" >> $GITHUB_OUTPUT
            else
              echo "flags=--org-chart" >> $GITHUB_OUTPUT
            fi
          else
            TARGET="${{ inputs.sync_target }}"
            if [ "$TARGET" = "all" ]; then
              echo "flags=--all" >> $GITHUB_OUTPUT
            else
              echo "flags=--${TARGET}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run sync
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: python3 _shared/scripts/sync_org_context.py ${{ steps.target.outputs.flags }}

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _shared/context/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          CHANGED=$(git diff --staged --name-only | xargs -I{} basename {} .md | tr '\n' ', ' | sed 's/,$//')
          SUBJECT="sync: ${CHANGED} $(date +%Y-%m-%d)"
          BRANCH="bot/sync-org-context"

          # One stable branch, recreated from main each run. delete_branch_on_merge
          # is on, so in the normal case it does not exist; when a previous week's
          # PR is still open, this force-push updates that PR in place rather than
          # stacking a second one.
          git checkout -b "$BRANCH"
          git commit -m "$SUBJECT"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$BRANCH" \
              --title "$SUBJECT" \
              --body "Automated weekly sync of \`_shared/context/\` from Airtable.

          Data only — no plugin code changes, so no version bump (see the
          \`_shared/context/\` exemption in \`.github/scripts/check_plugin_version.py\`).

          Opened by the \`Sync Org Context\` workflow. Auto-merges when checks pass."
          else
            echo "Existing open PR for $BRANCH updated by the push above."
          fi

          # Fail loudly if auto-merge cannot be armed. A PR that silently sits
          # open is the same outage as the push that silently failed — the whole
          # reason this file was rewritten.
          if ! gh pr merge "$BRANCH" --auto --squash; then
            echo "::error::Could not enable auto-merge on the sync PR. It is open but \
          will not land on its own — check that auto-merge is enabled in repo settings."
            exit 1
          fi
